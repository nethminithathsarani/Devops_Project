services:
  frontend:
    image: nethmini12/personal-blog-frontend:latest
    container_name: frontend_c
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80" # Serve React build via nginx on port 80
    environment:
      - REACT_APP_API_URL=http://localhost:5000 # Used only at build time; kept for local clarity

  backend:
    image: nethmini12/personal-blog-backend:latest
    container_name: backend_c
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/mydb

  mongo:
    image: mongo:6
    container_name: mongo_c
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: